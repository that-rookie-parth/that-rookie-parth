<svg xmlns="http://www.w3.org/2000/svg" width="860" height="172" viewBox="0 0 860 172" role="img" aria-labelledby="title description" fill="#EDE8F7">
  <title id="title">Language mix</title>
  <desc id="description">Python leads the source language mix after notebooks, markup, styles, configuration and generated files are excluded.</desc>
  <style>.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}</style>
  <rect x="1" y="1" width="858" height="170" rx="12" fill="#0D0A14" stroke="#2A2140" stroke-width="2"/>
  <text x="24" y="38" class="mono" font-size="12" fill="#A99FC0">Python leads at 91.8%</text>
  <defs><clipPath id="bar"><rect x="24" y="64" width="812" height="18" rx="9"/></clipPath></defs>
  <g clip-path="url(#bar)">
    <rect x="24" y="64" width="740" height="18" fill="#3776AB"/>
    <rect x="766" y="64" width="45" height="18" fill="#4CC3E0"/>
    <rect x="813" y="64" width="15" height="18" fill="#B7472A"/>
    <rect x="830" y="64" width="6" height="18" fill="#F1E05A"/>
  </g>
  <circle cx="29" cy="113" r="5" fill="#3776AB"/><text x="43" y="117" class="mono" font-size="12">Python</text><text x="243" y="117" class="mono" font-size="12" fill="#A99FC0">91.8%</text>
  <circle cx="305" cy="113" r="5" fill="#4CC3E0"/><text x="319" y="117" class="mono" font-size="12">TypeScript</text><text x="519" y="117" class="mono" font-size="12" fill="#A99FC0">5.6%</text>
  <circle cx="581" cy="113" r="5" fill="#B7472A"/><text x="595" y="117" class="mono" font-size="12">PowerShell</text><text x="795" y="117" class="mono" font-size="12" fill="#A99FC0">1.8%</text>
  <circle cx="29" cy="148" r="5" fill="#F1E05A"/><text x="43" y="152" class="mono" font-size="12">JavaScript</text><text x="243" y="152" class="mono" font-size="12" fill="#A99FC0">0.7%</text>
</svg>

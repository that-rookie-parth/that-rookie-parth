name: Update profile statistics

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

concurrency:
  group: update-profile-statistics
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out the profile repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Refresh generated cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_profile_stats.py

      - name: Test the generator and generated cards
        run: python -m unittest discover -s tests -v

      - name: Commit changed cards
        run: |
          if git diff --quiet -- assets/activity-dark.svg assets/activity-light.svg assets/languages-dark.svg assets/languages-light.svg; then
            echo "Profile statistics are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/activity-dark.svg assets/activity-light.svg assets/languages-dark.svg assets/languages-light.svg
          git commit -m "chore: refresh profile statistics"
          git push
